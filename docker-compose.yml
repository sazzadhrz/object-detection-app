services:
  # FastAPI + YOLO model
  backend:
    build: ./backend
    container_name: yolo-backend
    ports:
      - "8000:8000"
    # Docker checks this command to know when the backend is ready
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Streamlit user interface
  frontend:
    build: ./frontend
    container_name: yolo-frontend
    ports:
      - "8501:8501"
    environment:
      # "backend" is the service name above. Docker Compose lets
      # containers reach each other using the service name.
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
